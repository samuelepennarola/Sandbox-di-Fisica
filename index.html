<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fisica">
  <meta name="theme-color" content="#f6f3ea">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Sandbox di Fisica</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/contrib/auto-render.min.js"></script>
  <script>
    try {
      const t = localStorage.getItem('fs.theme');
      document.documentElement.dataset.theme = t ? JSON.parse(t)
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch { document.documentElement.dataset.theme = 'light'; }
    // Fondo della pagina e barra di stato già nel colore giusto prima che si carichi lo stile: niente lampo chiaro.
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.style.background = dark ? '#0b0b0d' : '#f6f3ea';
    document.querySelector('meta[name=theme-color]').content = dark ? '#0b0b0d' : '#f6f3ea';
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="topbar">
    <div class="group nav">
      <button class="icon-btn" id="menuBtn" data-icon="menu" title="Esperimenti"></button>
      <button class="crumb" id="crumbBtn" title="Scegli un esperimento"><span id="crumbArea"></span><span class="sep">›</span><strong id="crumbExp"></strong><span class="crumb-chev" data-icon="chevron"></span></button>
    </div>

    <div class="group sim">
      <button class="icon-btn" id="resetBtn" data-icon="reset" title="Ricomincia (R)"></button>
      <button class="icon-btn primary" id="playBtn" data-icon="play" title="Avvia / pausa (spazio)"></button>
      <button class="icon-btn" id="stepBtn" data-icon="step" title="Avanza di un fotogramma"></button>
      <button class="speed-btn" id="speedBtn" title="Velocità della simulazione">1×</button>
      <span class="clock" id="clock">t = 0,00 s</span>
    </div>

    <div class="group tools">
      <div class="seg" id="toolSeg">
        <button data-tool="hand" data-icon="hand" title="Mano: sposta e manipola (H)"></button>
        <button data-tool="pen" data-icon="pen" title="Penna (P)"></button>
        <button data-tool="eraser" data-icon="eraser" title="Gomma (E)"></button>
        <button data-tool="lasso" data-icon="lasso" title="Lazo: seleziona, sposta, ingrandisci (L)"></button>
      </div>
      <div class="swatches" id="swatches">
        <button data-color="ink" title="Inchiostro"></button>
        <button data-color="inkRed" title="Rosso"></button>
        <button data-color="inkBlue" title="Blu"></button>
        <button data-color="inkGreen" title="Verde"></button>
        <button data-color="inkYellow" title="Giallo"></button>
      </div>
      <button class="icon-btn" id="undoBtn" data-icon="undo" title="Annulla (⌘Z)"></button>
      <button class="icon-btn" id="redoBtn" data-icon="redo" title="Ripeti (⇧⌘Z)"></button>
      <button class="icon-btn" id="clearBtn" data-icon="trash" title="Cancella tutti gli appunti a penna (non la scena)"></button>
    </div>

    <div class="group view">
      <button class="icon-btn" id="fitBtn" data-icon="target" title="Inquadra la scena"></button>
      <div class="seg mode" id="modeSeg">
        <button data-mode="explore" title="Esplora: controlli, formule e grafici">Esplora</button>
        <button data-mode="lesson" title="Spiega: solo la scena e gli appunti">Spiega</button>
      </div>
      <button class="icon-btn" id="inspBtn" data-icon="sidebar" title="Mostra / nascondi il pannello"></button>
    </div>
  </header>

  <nav id="rail" class="hidden" aria-label="Strumenti"></nav>
  <div id="pins" class="hidden"></div>

  <div class="timeline" id="timeline">
    <button class="icon-btn" id="tlStart" data-icon="skipBack" title="Torna all'inizio"></button>
    <input type="range" id="tlRange" min="0" max="1" step="1" value="0" aria-label="Moviola">
    <button class="icon-btn" id="tlEnd" data-icon="skipFwd" title="Torna all'istante attuale"></button>
    <span class="tl-label" id="tlLabel">0,00 s</span>
  </div>

  <div class="popover hidden" id="penPop">
    <div class="seg wide"><button data-type="pen">Penna</button><button data-type="brush">Pennello</button></div>
    <div class="sub">Spessore <span id="penSizeLabel"></span></div>
    <div class="pen-presets" id="penPresets"></div>
    <input type="range" id="penSizeRange" step="0.1" aria-label="Spessore della penna">
    <canvas id="penPreview" class="pen-preview"></canvas>
  </div>

  <div class="ctxbar hidden" id="ctxbar"></div>

  <div class="selbar hidden" id="selbar">
    <button id="selCopy">Copia</button>
    <button id="selDelete" class="danger">Elimina</button>
  </div>

  <div id="scrim"></div>
  <nav id="drawer" aria-label="Esperimenti"></nav>
  <div id="panels"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
