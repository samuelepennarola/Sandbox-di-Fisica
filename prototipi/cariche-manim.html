<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Prototipo · Cariche in stile Manim</title>
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <script defer src="../vendor/katex/katex.min.js"></script>
  <style>
    :root { --bg: #0b0b0d; --fg: #ece9e0; --muted: #9a9a9a; --panel: rgba(20, 20, 24, .82); --line: rgba(255, 255, 255, .12); --accent: #58C4DD; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; touch-action: none; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .lab { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, clip-path; font-size: 19px; }
    .lab .katex { font-size: 1em; }
    #formula { position: fixed; left: 18px; top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 20px;
      background: rgba(0, 0, 0, .35); border: 1px solid var(--line); pointer-events: none; min-height: 50px; }
    #formula .row { white-space: nowrap; line-height: 1.9; }
    #bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 16px; background: var(--panel);
      border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100vw - 32px); }
    button { font: inherit; color: var(--fg); background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
      border-radius: 11px; min-height: 44px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--accent); color: #0b0b0d; border-color: transparent; font-weight: 700; }
    button:disabled { opacity: .4; }
    #step { color: var(--muted); padding: 0 6px; min-width: 9em; text-align: center; font-size: 13px; }
    #opts { position: fixed; right: 16px; top: 16px; width: 250px; padding: 12px; border-radius: 14px; background: var(--panel);
      border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; }
    #opts h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    #opts .seg { display: flex; gap: 4px; margin: 4px 0 10px; flex-wrap: wrap; }
    #opts .seg button { min-height: 34px; padding: 0 9px; font-size: 12.5px; border-radius: 8px; }
    #opts .seg button.on { background: rgba(88, 196, 221, .22); border-color: var(--accent); }
    #opts label { color: var(--muted); }
    #opts.min .body { display: none; }
    #opts .head { display: flex; justify-content: space-between; align-items: center; }
    #opts .head button { min-height: 30px; padding: 0 8px; font-size: 12px; }
    #hint { position: fixed; left: 18px; bottom: 86px; color: var(--muted); font-size: 12.5px; max-width: 300px; pointer-events: none; }
    @media (max-width: 900px) { #opts { top: auto; bottom: 86px; } #hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="formula"></div>
  <div id="opts">
    <div class="head"><h3>Varianti di stile</h3><button id="optMin">Nascondi</button></div>
    <div class="body">
      <label>Sfondo</label>
      <div class="seg" data-opt="bg"><button data-v="#000000">Nero</button><button data-v="#0b0b0d">Quasi nero</button><button data-v="#1c1d21">Antracite</button><button data-v="#172026">Attuale</button></div>
      <label>Griglia</label>
      <div class="seg" data-opt="grid"><button data-v="plane">Piano di Manim</button><button data-v="faint">Tenue</button><button data-v="none">Nessuna</button></div>
      <label>Linee di campo</label>
      <div class="seg" data-opt="lines"><button data-v="magnitude">Colore = intensità</button><button data-v="white">Bianche</button></div>
      <label>Etichette sulla scena</label>
      <div class="seg" data-opt="labels"><button data-v="tex">Serif corsivo (TeX)</button><button data-v="sans">Sans attuale</button></div>
    </div>
  </div>
  <div id="hint">Trascina le cariche e la sonda col dito, la Pencil o il mouse. Tocca una carica per invertirne il segno.</div>
  <div id="bar">
    <button id="restart" title="Ricomincia la sequenza">↺ Da capo</button>
    <span id="step">—</span>
    <button id="next" class="primary">Avanti ›</button>
    <button id="all">▶ Tutto</button>
  </div>
  <script type="module" src="cariche-manim.js"></script>
</body>
</html>
