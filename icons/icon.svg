  <path d="M241.5 182.5H296" stroke="#FFD84A" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.85"/>
  <!-- raggio e punto -->
  <path d="M168 256L241.5 182.5" stroke="#58C4DD" stroke-width="12" stroke-linecap="round"/>
  <circle cx="168" cy="256" r="9" fill="#ECE9E0"/>
  <circle cx="241.5" cy="182.5" r="46" fill="url(#glow)"/>
  <circle cx="241.5" cy="182.5" r="19" fill="#FFD84A"/>
  <circle cx="296" cy="182.5" r="11" fill="#FC6255"/>
