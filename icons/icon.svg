<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#round)">
  <!-- Icona di Fisicamente, nello stile della scena (3Blue1Brown / Manim): il punto che gira sulla
       circonferenza e la sua proiezione che disegna la sinusoide. Versione con gli angoli arrotondati (favicon); icon-full.svg è quella a fondo pieno. -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="45%" r="75%">
      <stop offset="0" stop-color="#181b23"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#FC6255"/>
      <stop offset="1" stop-color="#FC6255" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFD84A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- NumberPlane: suddivisioni tenui e linee principali appena più marcate -->
  <g stroke="#29ABCA" stroke-width="2" opacity="0.10">
    <path d="M32 0V512M96 0V512M160 0V512M224 0V512M288 0V512M352 0V512M416 0V512M480 0V512"/>
    <path d="M0 32H512M0 96H512M0 160H512M0 224H512M0 288H512M0 352H512M0 416H512M0 480H512"/>
  </g>
  <g stroke="#29ABCA" stroke-width="3" opacity="0.28">
    <path d="M64 0V512M192 0V512M320 0V512M448 0V512"/>
    <path d="M0 128H512M0 384H512"/>
  </g>
  <!-- assi -->
  <path d="M40 256H488" stroke="#ECE9E0" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <path d="M168 120V392" stroke="#ECE9E0" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
  <!-- circonferenza di raggio 104 centrata in (168, 256) -->
  <circle cx="168" cy="256" r="104" fill="none" stroke="#ECE9E0" stroke-width="10"/>
  <!-- sinusoide y = 256 − 104·sin(45° + (x − 296)/40): parte alla stessa altezza del punto -->
  <path fill="none" stroke="url(#fadeR)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
    d="M296.0 182.5 L299.0 177.2 L302.0 172.3 L305.0 167.9 L308.0 164.0 L311.0 160.6 L314.0 157.8 L317.0 155.5 L320.0 153.8 L323.0 152.6 L326.0 152.1 L329.0 152.1 L332.0 152.7 L335.0 153.9 L338.0 155.6 L341.0 157.9 L344.0 160.8 L347.0 164.2 L350.0 168.1 L353.0 172.6 L356.0 177.4 L359.0 182.8 L362.0 188.5 L365.0 194.6 L368.0 201.1 L371.0 207.9 L374.0 214.9 L377.0 222.2 L380.0 229.6 L383.0 237.3 L386.0 245.0 L389.0 252.8 L392.0 260.6 L395.0 268.3 L398.0 276.0 L401.0 283.6 L404.0 291.1 L407.0 298.3 L410.0 305.3 L413.0 312.0 L416.0 318.4 L419.0 324.5 L422.0 330.2 L425.0 335.4 L428.0 340.2 L431.0 344.6 L434.0 348.4 L437.0 351.7 L440.0 354.5 L443.0 356.7 L446.0 358.4 L449.0 359.5 L452.0 360.0 L455.0 359.9 L458.0 359.2 L461.0 358.0 L464.0 356.1 L467.0 353.8 L470.0 350.8 L473.0 347.4 L476.0 343.4"/>
